<svg width="120" height="120" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F1F5F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(10, 10)">
    <!-- 외부 프레임 -->
    <rect x="0" y="0" width="120" height="120" rx="33.6" fill="url(#frameGradient)"/>
    
    <!-- 흰색 중간층 -->
    <rect x="4.2" y="4.2" width="111.6" height="111.6" rx="30" fill="white"/>
    
    <!-- 내부 블루 바디 -->
    <rect x="9" y="9" width="102" height="102" rx="26.4" fill="url(#bodyGradient)"/>
    
    <!-- 눈 그룹 -->
    <!-- 전체 눈 영역: 36 + 16.8 + 36 = 88.8px -->
    <!-- 중앙 정렬: (120 - 88.8) / 2 = 15.6px 시작 -->
    <g id="eyes">
      <!-- 왼쪽 눈: x = 15.6 -->
      <rect x="15.6" y="46.8" width="36" height="26.4" rx="10.08" fill="white">
        <animate 
          attributeName="height" 
          values="26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;3;26.4;26.4;26.4;26.4;26.4" 
          dur="4s" 
          repeatCount="indefinite"/>
        <animate 
          attributeName="y" 
          values="46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;58.5;46.8;46.8;46.8;46.8;46.8" 
          dur="4s" 
          repeatCount="indefinite"/>
      </rect>
      
      <!-- 오른쪽 눈: x = 15.6 + 36 + 16.8 = 68.4 -->
      <rect x="68.4" y="46.8" width="36" height="26.4" rx="10.08" fill="white">
        <animate 
          attributeName="height" 
          values="26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;26.4;3;26.4;26.4;26.4;26.4;26.4" 
          dur="4s" 
          repeatCount="indefinite"/>
        <animate 
          attributeName="y" 
          values="46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;46.8;58.5;46.8;46.8;46.8;46.8;46.8" 
          dur="4s" 
          repeatCount="indefinite"/>
      </rect>
      
      <!-- 눈 움직임 -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 2.5,-1.5; -2.5,1.5; 0,0"
        dur="1.5s"
        repeatCount="indefinite"/>
    </g>
    
    <!-- 갸웃거림 -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 60 60; 5 60 60; -5 60 60; 0 60 60"
      dur="6s"
      repeatCount="indefinite"/>
  </g>
</svg>
